name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # A real browser (Chromium) clicking through the built store, on desktop and phone sizes
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # on a failure the report has the trace and a screenshot of each step
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The tests use PGlite. Here the API starts with a real Postgres
  # to make sure the migrations and sign up work on it too.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://store:store@localhost:5432/store
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the API and test sign up
        working-directory: server
        run: |
          NODE_ENV=production node dist/server.js &
          for i in $(seq 1 30); do curl -sf localhost:3333/api/health && break; sleep 1; done
          curl -sf -X POST localhost:3333/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Test","email":"ci@example.com","password":"strong-password-123"}'
          npm run make-admin -- ci@example.com
